<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%PUBLIC_URL%/pics-removebg-preview.png" />
      <meta property="og:title" content="Abeebdon" />
    <meta property="og:description" content="My personal portfolio" />
    <meta
      property="og:image"
      content="https://abeebdon.netlify.app/abeeb.png"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abeebdon.netlify.app" />

    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1120"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="Web site created using create-tsrouter-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Abeebdon</title>
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong colors
      ;(function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          document.documentElement.classList.toggle('dark', theme === 'dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
